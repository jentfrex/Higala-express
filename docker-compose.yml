version: '3.8'

services:
  web:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - DATABASE_URL=sqlite:///./higala_express.db
      - REDIS_URL=redis://redis:6379
      - PORT=${PORT:-8000}
    volumes:
      - .:/app
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always