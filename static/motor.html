<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Higala Super App - Motor Express (CDO)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f59e0b; min-height: 100vh; }</style>
</head>
<body class="p-6 flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-3xl p-6 shadow-2xl border-4 border-amber-500 space-y-4">
        <div class="flex items-center justify-between bg-amber-500 text-amber-950 p-4 rounded-2xl">
            <div class="flex items-center space-x-3">
                <i class="fas fa-motorcycle text-2xl"></i>
                <div>
                    <h1 class="font-extrabold text-base">Habal-habal / Motor Fare Calculator</h1>
                    <p class="text-[10px] font-bold uppercase tracking-wider">Cagayan de Oro City</p>
                </div>
            </div>
            <a href="/static/customer.html" class="bg-white text-amber-900 px-3 py-1.5 rounded-xl font-bold text-xs shadow hover:bg-amber-50 transition">🗺️ Map App</a>
        </div>

        <div class="space-y-3 text-xs">
            <div class="p-3 bg-amber-50 rounded-xl border border-amber-200">
                <span class="font-extrabold text-amber-900 block">📜 Legal Motor Rate (CDO Standard):</span>
                <p class="text-slate-600 mt-0.5">₱45.00 minimum base fare (1st km) + ₱15.00/km succeeding.</p>
            </div>

            <div>
                <label class="block font-bold text-slate-700 mb-1">Pilian nga Destinasyon sa CDO:</label>
                <select id="motor-dest" onchange="calculateMotor()" class="w-full p-3 bg-amber-50 border border-amber-300 rounded-xl font-bold">
                    <option value="1">Limketkai Center (1.0 km - Base)</option>
                    <option value="2.5">Carmen Market (~2.5 km)</option>
                    <option value="3">Cogon Market (~3.0 km)</option>
                    <option value="4.5">City Hall (~4.5 km)</option>
                    <option value="6">Agora Terminal (~6.0 km)</option>
                </select>
            </div>

            <div class="p-4 bg-slate-900 text-amber-400 rounded-2xl text-center">
                <span class="text-[10px] uppercase font-bold text-white block">Computed Motor Fare:</span>
                <span id="motor-result" class="text-2xl font-extrabold">₱45.00</span>
                <div id="distance-info" class="text-[11px] text-slate-400 mt-1">Base Fare / Manual Select</div>
            </div>
        </div>
    </div>

    <script>
        function calculateMotor(customKm = null) {
            let km = customKm;
            if (km === null) {
                km = parseFloat(document.getElementById('motor-dest').value);
            }
            
            // Saktong pormula: 45 base fare sa unang 1km, sunod 15 kada km
            let fare = km <= 1.0 ? 45.00 : 45.00 + ((km - 1.0) * 15.00);
            document.getElementById('motor-result').innerText = `₱${Math.round(fare).toFixed(2)}`;
            
            const distInfo = document.getElementById('distance-info');
            if (distInfo) {
                distInfo.innerText = `Estimated Distance: ${km.toFixed(2)} km`;
            }
        }

        // Kung naay gipadala nga distance gikan sa URL parameters (pananglitan gikan sa main map app)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const kmParam = urlParams.get('km');
            if (kmParam) {
                calculateMotor(parseFloat(kmParam));
            }
        });
    </script>
</body>
</html>
