<div class="cart-drawer-content" style="padding: 16px; font-family: sans-serif; color: #1a1a1a;">
    <h3 style="font-size: 16px; font-weight: 800; margin-bottom: 12px; border-bottom: 2px solid #ff6600; padding-bottom: 6px;">🛒 Imong Cart Items</h3>
    
    <!-- Listahan sa mga gipili -->
    <div id="cartItemsList" style="max-height: 250px; overflow-y: auto; margin-bottom: 12px;">
        <!-- Dinhi i-inject sa JavaScript ang mga items -->
        <div style="color: #717171; font-size: 12px; text-align: center; padding: 20px;">Walay sulod ang imong cart.</div>
    </div>

    <!-- Subtotals & Totals -->
    <div style="border-top: 1px solid #eee; padding-top: 10px; font-size: 13px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
            <span>Subtotal:</span>
            <span id="cartSubtotal">₱0.00</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
            <span>Delivery Fee:</span>
            <span id="cartDeliveryFee">₱50.00</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 15px; margin-top: 8px; color: #ff6600;">
            <span>Total:</span>
            <span id="cartTotal">₱50.00</span>
        </div>
    </div>
</div>

<script>
    // Global function aron ma-update ang display sa cart drawer
    window.updateCartDisplay = function() {
        const container = document.getElementById('cartItemsList');
        const subtotalEl = document.getElementById('cartSubtotal');
        const totalEl = document.getElementById('cartTotal');
        const badge = document.getElementById('cartBadge');

        // Kuhaa ang items gikan sa global window.cart o window.cartItems
        const items = window.cart || window.cartItems || [];

        if (badge) {
            const totalQty = items.reduce((sum, i) => sum + i.qty, 0);
            badge.innerText = totalQty;
        }

        if (!container) return;

        if (items.length === 0) {
            container.innerHTML = '<div style="color: #717171; font-size: 12px; text-align: center; padding: 20px;">Walay sulod ang imong cart.</div>';
            if (subtotalEl) subtotalEl.innerText = '₱0.00';
            if (totalEl) totalEl.innerText = '₱50.00';
            return;
        }

        let html = '';
        let subtotal = 0;

        items.forEach((item, index) => {
            const itemTotal = item.price * item.qty;
            subtotal += itemTotal;
            html += `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; background: #f9f9f9; padding: 8px; border-radius: 8px;">
                    <div>
                        <div style="font-weight: 700; font-size: 12px;">${item.emoji || '💊'} ${item.name}</div>
                        <div style="font-size: 11px; color: #717171;">₱${item.price.toFixed(2)} x ${item.qty}</div>
                    </div>
                    <div style="font-weight: 800; font-size: 12px; color: #333;">₱${itemTotal.toFixed(2)}</div>
                </div>
            `;
        });

        container.innerHTML = html;
        if (subtotalEl) subtotalEl.innerText = `₱${subtotal.toFixed(2)}`;
        const deliveryFee = 50.00;
        if (totalEl) totalEl.innerText = `₱${(subtotal + deliveryFee).toFixed(2)}`;
    };

    // Auto-run pag-load sa cart.html
    document.addEventListener("DOMContentLoaded", () => {
        window.updateCartDisplay();
    });
</script>
