<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Higala Super App - CDO Taxi Meter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0284c7; min-height: 100vh; }</style>
</head>
<body class="p-6 flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-3xl p-6 shadow-2xl border-4 border-sky-500 space-y-4">
        <div class="flex items-center justify-between bg-sky-600 text-white p-4 rounded-2xl">
            <div class="flex items-center space-x-3">
                <i class="fas fa-taxi text-2xl"></i>
                <div>
                    <h1 class="font-extrabold text-base">CDO Comfort Taxi / Sedan Meter</h1>
                    <p class="text-[10px] font-bold uppercase tracking-wider">LTFRB Standard Formula</p>
                </div>
            </div>
            <a href="/static/customer.html" class="bg-white text-sky-900 px-3 py-1.5 rounded-xl font-bold text-xs shadow hover:bg-sky-50 transition">🗺️ Map App</a>
        </div>

        <div class="space-y-3 text-xs">
            <div class="p-3 bg-sky-50 rounded-xl border border-sky-200">
                <span class="font-extrabold text-sky-900 block">📜 Legal Taxi Rate:</span>
                <p class="text-slate-600 mt-0.5">₱45.00 Flagdown rate + ₱13.50 kada succeeding km.</p>
            </div>

            <div>
                <label class="block font-bold text-slate-700 mb-1">Pilian nga Destinasyon sa CDO:</label>
                <select id="taxi-dest" onchange="calculateTaxi()" class="w-full p-3 bg-sky-50 border border-sky-300 rounded-xl font-bold">
                    <option value="1">Limketkai Center (1.0 km - Flagdown)</option>
                    <option value="2.5">Carmen Market (~2.5 km)</option>
                    <option value="3">Cogon Market (~3.0 km)</option>
                    <option value="4.5">City Hall (~4.5 km)</option>
                    <option value="9">SM Uptown (~9.0 km)</option>
                </select>
            </div>

            <div class="p-4 bg-slate-900 text-sky-400 rounded-2xl text-center">
                <span class="text-[10px] uppercase font-bold text-white block">Computed Taxi Meter Fare:</span>
                <span id="taxi-result" class="text-2xl font-extrabold">₱45.00</span>
            </div>
        </div>
    </div>

    <script>
        function calculateTaxi() {
            const km = parseFloat(document.getElementById('taxi-dest').value);
            let flagdown = 45.00;
            let succeedingRate = 13.50;
            let fare = km <= 1.0 ? flagdown : flagdown + ((km - 1.0) * succeedingRate);
            document.getElementById('taxi-result').innerText = `₱${Math.round(fare).toFixed(2)}`;
        }
    </script>
</body>
</html>
